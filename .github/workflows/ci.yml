name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The conformance fixtures are what the library gives (ports are held to them)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx tsx conformance/generate.ts && git diff --exit-code conformance/fixtures
      - { name: The Python port's fixtures are what the library gives, if: "matrix.os == 'ubuntu-latest' && matrix.node == 24", run: npx tsx conformance/generate-python.ts && git diff --exit-code conformance/fixtures }
      - { name: The Python port's second fixtures are what the library gives, if: "matrix.os == 'ubuntu-latest' && matrix.node == 24", run: npx tsx conformance/generate-python-2.ts && git diff --exit-code conformance/fixtures }
      - { name: The retrievers' documents are what the library gives, if: "matrix.os == 'ubuntu-latest' && matrix.node == 24", run: npx tsx conformance/generate-retriever.ts && git diff --exit-code conformance/fixtures }
      - { name: The MCP server's answers are what the library gives, if: "matrix.os == 'ubuntu-latest' && matrix.node == 24", run: npx tsx conformance/generate-mcp.ts && git diff --exit-code conformance/fixtures }

  # Run as root, as in most containers: a downloaded binary must still count as this user's own.
  as-root:
    runs-on: ubuntu-latest
    container: node:22-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx vitest run src/core/qdrant-binary.test.ts

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/memtrails
          key: memtrails-cache-${{ hashFiles('src/core/model.ts', 'src/core/qdrant-binary.ts') }}
      - run: npm ci
      - run: npm run test:integration
      - name: The examples run, and the quick start finds what it should
        run: |
          npx tsx examples/quickstart.ts | tee quickstart.txt
          grep -q "^1\. Proxy certificate expired (email" quickstart.txt
          npx tsx examples/agent-tools.ts --schemas | grep -q '"memory_explore"'
