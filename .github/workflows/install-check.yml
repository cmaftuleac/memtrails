name: Install check

# A released version as users get it: installed from npm, PyPI and crates.io on Linux, macOS and Windows, a few records
# added and searched with the real model and Qdrant. Started by hand after a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to install (e.g. 0.5.4)'
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  # memtrails runs ONNX Runtime on the CPU: its installer's CUDA download is never used (SECURITY.md).
  ONNXRUNTIME_NODE_INSTALL: skip

defaults:
  run:
    shell: bash

jobs:
  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: |
          mkdir check && cd check && npm init -y >/dev/null
          # A new version reaches each registry's index a few minutes after it is published.
          for i in $(seq 1 20); do npm install "memtrails@$VERSION" && break; sleep 30; done
          cat > check.mjs <<'EOF'
          import { openMemory } from 'memtrails';
          const memory = await openMemory({ home: 'memory' });
          await memory.add([
            { id: 'mail-1', kind: 'email', title: 'Proxy certificate expired', text: 'Renewal stopped because the cron job was removed in March.' },
            { id: 'note-2', kind: 'note', title: 'Lunch', text: 'Friday lunch is at the Italian place near the office.' },
          ]);
          const hits = await memory.search({ query: 'why did the certificate stop renewing?' });
          await memory.close();
          console.log('top:', hits[0]?.title);
          if (hits[0]?.title !== 'Proxy certificate expired') process.exit(1);
          EOF
          node check.mjs
          npx --no-install memtrails --version | grep -qx "$VERSION"

  pypi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: |
          for i in $(seq 1 20); do python -m pip install --no-cache-dir "memtrails==$VERSION" && break; sleep 30; done
          mkdir check && cd check
          cat > check.py <<'EOF'
          import asyncio, sys
          from memtrails import open_memory

          async def main() -> None:
              async with await open_memory(home="memory") as memory:
                  await memory.add([
                      {"id": "mail-1", "kind": "email", "title": "Proxy certificate expired", "text": "Renewal stopped because the cron job was removed in March."},
                      {"id": "note-2", "kind": "note", "title": "Lunch", "text": "Friday lunch is at the Italian place near the office."},
                  ])
                  hits = await memory.search({"query": "why did the certificate stop renewing?"})
              print("top:", hits[0]["title"])
              sys.exit(0 if hits[0]["title"] == "Proxy certificate expired" else 1)

          asyncio.run(main())
          EOF
          python check.py
          memtrails --version | grep -qx "$VERSION"

  crates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: |
          cargo new -q check && cd check
          for i in $(seq 1 20); do cargo add -q "memtrails@=$VERSION" && break; sleep 30; done
          cargo add -q tokio --features macros,rt-multi-thread
          cat > src/main.rs <<'EOF'
          use memtrails::{Memory, MemoryOptions, MemoryRecord, SearchQuery};

          #[tokio::main]
          async fn main() -> memtrails::Result<()> {
              let memory = Memory::open(MemoryOptions::new("memory")).await?;
              memory.add(vec![
                  MemoryRecord { kind: Some("email".into()), title: Some("Proxy certificate expired".into()), ..MemoryRecord::new("mail-1", "Renewal stopped because the cron job was removed in March.") },
                  MemoryRecord { kind: Some("note".into()), title: Some("Lunch".into()), ..MemoryRecord::new("note-2", "Friday lunch is at the Italian place near the office.") },
              ]).await?;
              let hits = memory.search(&SearchQuery::new("why did the certificate stop renewing?")).await?;
              memory.close().await?;
              println!("top: {}", hits[0].title);
              std::process::exit(if hits[0].title == "Proxy certificate expired" { 0 } else { 1 });
          }
          EOF
          cargo run -q --release
      - run: |
          cargo install -q --locked memtrails --version "$VERSION" --root "$RUNNER_TEMP/mt"
          "$RUNNER_TEMP/mt/bin/memtrails" --version | grep -qx "$VERSION"
