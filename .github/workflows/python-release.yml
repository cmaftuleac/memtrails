name: Python release

# Publishes the Python package to PyPI when a tag py-v<version> is pushed (git tag py-v0.4.0 && git push origin
# py-v0.4.0), through PyPI trusted publishing: GitHub's short-lived OIDC token, no PyPI token stored anywhere. The tag
# must match python/pyproject.toml's version. PyPI needs the project's trusted publisher set up first: this repository,
# the workflow python-release.yml, the environment pypi.
#
# Two jobs, so the token that can publish is never in reach of the install: `build` installs the dependencies and runs
# the checks with read-only rights, and builds the sdist and the wheel; `publish` installs nothing and only uploads them.
on:
  push:
    tags: ['py-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: The tag is the package's version
        run: test "py-v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,langchain,llama-index]' build==1.3.0
      - run: ruff check src tests
      - run: mypy
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: python/dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
