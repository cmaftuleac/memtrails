name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: python -m pytest -q

  # Run as root, as in most containers: a downloaded binary must still count as this user's own.
  as-root:
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:e695ab189fa2d082b1c61c69a6b888a5adeca61ceeccad107b1ed2a125721a9e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python -m pip install --root-user-action=ignore -e '.[dev]'
      - run: python -m pytest -q tests/test_downloads.py

  # The real EmbeddingGemma model and a real Qdrant, both fetched into the cache (checked against their pinned hashes)
  # on the first run and kept between runs. Then the TypeScript library embeds the fixture's texts on this same machine,
  # and Python must give the same vectors: ONNX Runtime's 4-bit kernels differ a little between CPU architectures, in
  # both libraries, so the vectors are compared where both ran.
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/memtrails
          key: memtrails-py-cache-${{ hashFiles('python/src/memtrails/core/model.py', 'python/src/memtrails/core/qdrant_binary.py') }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_integration.py
        env:
          MEMTRAILS_INTEGRATION: '1'
      - name: The examples run, and the quick start finds what it should
        run: |
          python examples/quickstart.py | tee quickstart.txt
          grep -q "^1\. Proxy certificate expired (email" quickstart.txt
          python examples/agent_tools.py --schemas | grep -q '"memory_explore"'
      - run: npm ci
        working-directory: .
      - run: MEMTRAILS_FIXTURE_MODEL="$HOME/.cache/memtrails/embeddinggemma-300m-5090578d" npx tsx conformance/generate-python.ts
        working-directory: .
      - run: python -m pytest -q tests/test_conformance_python.py
        env:
          MEMTRAILS_INTEGRATION: '1'
