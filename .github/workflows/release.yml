name: Release

# Publishes to npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1), through npm trusted
# publishing: GitHub's short-lived OIDC token, no npm token stored anywhere, provenance attached automatically.
# The tag must match package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --loglevel verbose
