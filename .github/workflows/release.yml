name: Release

# Publishes to npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1), through npm trusted
# publishing: GitHub's short-lived OIDC token, no npm token stored anywhere, provenance attached automatically.
# The tag must match package.json's version.
#
# Two jobs, so the token that can publish is never in reach of the install: `build` runs every dependency's install
# script and the tests with read-only rights, and packs the tarball; `publish` installs nothing and only publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: memtrails-*.tgz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      - run: npm publish memtrails-*.tgz --access public --loglevel verbose
