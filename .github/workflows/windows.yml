name: Windows

# The three libraries on Windows: their tests, and a real memory (the real model and Qdrant) searched by each quick
# start. On every change; started by hand, it can run one language, or chosen Python tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'One language only: typescript, python or rust (empty: all three)'
        default: ''
      pytest:
        description: 'Python: which tests, and options (empty: all of them)'
        default: ''

permissions:
  contents: read

env:
  # memtrails runs ONNX Runtime on the CPU: its installer's CUDA download is never used (SECURITY.md).
  ONNXRUNTIME_NODE_INSTALL: skip

defaults:
  run:
    shell: bash

jobs:
  typescript:
    if: inputs.only == '' || inputs.only == 'typescript'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - name: The quick start finds what it should
        run: |
          npx tsx examples/quickstart.ts | tee quickstart.txt
          grep -q "^1\. Proxy certificate expired (email" quickstart.txt

  python:
    if: inputs.only == '' || inputs.only == 'python'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,langchain,llama-index]'
      # Each test by name, and every thread's stack when one runs past five minutes: a hang shows where it is.
      - run: python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=300 $PYTEST_ARGS
        env:
          PYTEST_ARGS: ${{ inputs.pytest }}
      # A short base folder: Qdrant nests its index files deep under the memory's, and Windows limits a path to 260
      # characters (pytest's own folders under AppData are long already).
      - run: python -m pytest -q tests/test_integration.py --basetemp="$RUNNER_TEMP/p"
        env:
          MEMTRAILS_INTEGRATION: '1'
      - name: The quick start finds what it should
        run: |
          python examples/quickstart.py | tee quickstart.txt
          grep -q "^1\. Proxy certificate expired (email" quickstart.txt

  rust:
    if: inputs.only == '' || inputs.only == 'rust'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      # The stand-in Qdrant of the process tests is a Node.js script.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: cargo test --locked --no-fail-fast
      - run: cargo test --locked --test integration -- --ignored --test-threads=1
      - name: The quick start finds what it should
        run: |
          cargo run --locked -q --example quickstart | tee quickstart.txt
          grep -q "^1\. Proxy certificate expired (email" quickstart.txt
