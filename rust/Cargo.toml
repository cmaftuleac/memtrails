[package]
name = "memtrails"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Retrieval and exploration for any text: e-mail, chat, notes, documents, commits, conversations — local embeddings, a keyword channel and word-by-word reordering, with optional consolidation by a language model."
repository = "https://github.com/cmaftuleac/memtrails"
homepage = "https://github.com/cmaftuleac/memtrails"
documentation = "https://docs.rs/memtrails"
readme = "README.md"
keywords = ["memory", "retrieval", "search", "embeddings", "agents"]
categories = ["text-processing", "database"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
futures = "0.3"
hex = "0.4"
icu_segmenter = { version = "2", features = ["compiled_data"] }
indexmap = { version = "2", features = ["serde"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util", "net"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
